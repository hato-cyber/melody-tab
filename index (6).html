<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メロディ → 五線譜・タブ譜</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f5;--card:#fbfcfd;--ink:#15212b;--mute:#667683;--line:#8a99a6;--acc:#0e7c86;--accink:#fff;--bd:#d3dce3;--warn:#b4442a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e161d;--card:#17222b;--ink:#e8eef2;--mute:#8fa2b0;--line:#6d8190;--acc:#4fd1c5;--accink:#08201e;--bd:#26343f;--warn:#ff9a7a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e161d;--card:#17222b;--ink:#e8eef2;--mute:#8fa2b0;--line:#6d8190;--acc:#4fd1c5;--accink:#08201e;--bd:#26343f;--warn:#ff9a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:20px;margin:4px 2px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
select,input[type=number]{font:inherit;font-size:16px;padding:7px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--ink)}
input[type=number]{width:84px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:15px;min-height:42px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.rec{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700;padding:12px 20px;font-size:16px}
button.rec.on{background:var(--warn);border-color:var(--warn);color:#fff}
.live{margin-left:auto;text-align:right}
.live b{display:block;font-size:40px;line-height:1;min-width:3ch;font-weight:700;color:var(--acc)}
.live span{font-size:12px;color:var(--mute)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.keys button{padding:11px 0;font-weight:700}
.sub{font-size:13px;color:var(--mute);margin:8px 0 0}
[hidden]{display:none!important}
.score{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
svg{display:block}
.ln{stroke:var(--line);stroke-width:1;fill:none}
.nh{fill:var(--ink)}
.nho{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.st{stroke:var(--ink);stroke-width:1.4;fill:none}
.tx{fill:var(--ink);font-size:12px;font-weight:700;font-family:inherit}
.big{fill:var(--ink);font-size:22px;font-weight:700;font-family:inherit}
.mt{fill:var(--mute);font-size:11px;font-family:inherit}
.bg{fill:var(--card)}
.sel{fill:var(--acc);opacity:.16}
.chips{font-size:15px;word-break:break-all;margin-top:8px}
.msg{font-size:13px;color:var(--warn);margin:8px 0 0;min-height:1em}
.ed{border-top:1px solid var(--bd);margin-top:12px;padding-top:12px}
.ed b{color:var(--acc);font-size:18px}
</style>
</head>
<body>
<main>
<h1>メロディ → 五線譜・タブ譜</h1>

<section class="card">
  <div class="row">
    <label>テンポ (BPM)<input type="number" id="bpm" value="100" min="40" max="240" inputmode="numeric"></label>
    <button id="tap" style="align-self:flex-end">タップテンポ</button>
    <label>拍子<select id="ts"><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option></select></label>
    <label>元のキー<select id="from"></select></label>
    <label>変換後のキー<select id="to"></select></label>
    <span class="sub" id="shiftTxt" style="margin:0"></span>
  </div>
</section>

<section class="card">
  <div class="row">
    <button class="rec" id="rec">録音を始める</button>
    <div class="live"><b id="live">–</b><span>いま聞こえている音</span></div>
  </div>
  <div style="height:6px;background:var(--bd);border-radius:3px;margin-top:10px" title="入力レベル"><div id="lvl" style="height:100%;width:0;background:var(--acc);border-radius:3px"></div></div>
  <p class="msg" id="msg"></p>
  <label style="margin-top:8px">入力元<select id="src"><option value="auto">自動(外部機器があればそれ、なければ内蔵)</option><option value="builtin">スマホの内蔵マイク</option><option value="ext">外部機器(アクセサリ)</option></select></label>
  <label id="micWrap" hidden style="margin-top:8px">機器を個別に選ぶ<select id="mic"><option value="">自動</option></select></label>
  <p class="sub">単音で演奏してください。最初の音が1小節目の頭になり、テンポに合わせて長さを丸めます。外部機器がなければ、端末の内蔵マイクを使います。</p>
  <div class="row" style="margin-top:12px">
    <label>手入力の音域<select id="oct"><option value="2">低い (2)</option><option value="3" selected>ふつう (3)</option><option value="4">高い (4)</option></select></label>
    <label>手入力の長さ<select id="dur"></select></label>
    <label style="flex-direction:row;align-items:center;gap:6px;margin-top:16px"><input type="checkbox" id="sharp">半音上げる (♯)</label>
  </div>
  <div class="keys" id="keys"></div>
  <div class="row" style="margin-top:12px">
    <button id="imp">音声・動画ファイルから読み込む</button>
    <button id="requant" hidden>いまのテンポで変換し直す</button>
    <label id="rawWrap" hidden style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" id="rawt" checked>元のタイミングで再生</label>
    <input type="file" id="file" accept="audio/*,video/*" hidden>
  </div>
  <p class="sub" id="impMsg"></p>
</section>

<section class="card">
  <div class="score"><svg id="svg" height="300" width="400" role="img" aria-label="五線譜とタブ譜"></svg></div>
  <div class="chips" id="chips"></div>
  <div class="ed" id="ed" hidden>
    <div class="row"><span>選んだ音: <b id="sname"></b></span><button id="del" style="margin-left:auto">削除</button></div>
    <div class="row" style="margin-top:8px">
      <button id="p-1">半音 ▼</button><button id="p1">半音 ▲</button><button id="p-12">8度 ▼</button><button id="p12">8度 ▲</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="m-1">◀ 前へ</button><button id="m1">後ろへ ▶</button>
      <label>音符の種類<select id="edur"></select></label>
    </div>
  </div>
  <p class="sub">譜面の音をタップすると、高さ・位置(16分音符単位)・種類を直せます。五線譜はギター記譜(実音の1オクターブ上)、タブ譜は標準チューニングです。</p>
  <div class="row" style="margin-top:10px">
    <button id="play" class="rec" style="padding:9px 16px">▶ ピアノで再生</button>
    <button id="undo">1音戻す</button>
    <button id="clear">すべて消す</button>
  </div>
</section>
</main>

<script>
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LET=[0,0,1,1,2,3,3,4,4,5,5,6];
const STR=[64,59,55,50,45,40];
const DUR=[1,2,3,4,6,8,12,16],DN=['16分音符','8分音符','付点8分','4分音符','付点4分','2分音符','付点2分','全音符'];
const U=16,GAP=10,X0=56,TT=205,TG=14;
const $=id=>document.getElementById(id);
let notes=[],sel=null;
const nm=m=>NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
const snap=d=>DUR.reduce((a,b)=>Math.abs(b-d)<Math.abs(a-d)?b:a);
const bpm=()=>Math.min(240,Math.max(40,+$('bpm').value||100));
const barLen=()=>{const [n,d]=$('ts').value.split('/').map(Number);return n*16/d};
const endOf=()=>notes.reduce((e,n)=>Math.max(e,n.s+n.d),0);
const xOf=s=>X0+8+s*U;
const yS=s=>60+(8-s)*GAP/2;
function shift(){let s=((+$('to').value-+$('from').value)%12+12)%12;return s>6?s-12:s}

NAMES.forEach((n,i)=>{for(const id of ['from','to']){const o=document.createElement('option');o.value=i;o.textContent=n;$(id).appendChild(o)}});
for(const id of ['dur','edur'])DUR.forEach((d,i)=>{const o=document.createElement('option');o.value=d;o.textContent=DN[i];if(d===4&&id==='dur')o.selected=true;$(id).appendChild(o)});
['C','D','E','F','G','A','B'].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{const pc=NAMES.indexOf(n)+($('sharp').checked&&!'EB'.includes(n)?1:0);const x={m:12*(+$('oct').value+1)+pc,s:endOf(),d:+$('dur').value};notes.push(x);sel=x;render(true)};$('keys').appendChild(b)});

function tabPos(m,prev){let best=null;for(let i=0;i<6;i++){const f=m-STR[i];if(f<0||f>19)continue;const c=prev==null?f:Math.abs(f-prev)+f*0.2;if(!best||c<best.c)best={s:i,f,c}}return best}

function restSvg(a,d){
  const x=xOf(a),c=yS(4);let h='';
  if(d>=16)h=`<rect class="nh" x="${x-6}" y="${yS(6)}" width="12" height="5"/>`;
  else if(d>=8)h=`<rect class="nh" x="${x-6}" y="${c-5}" width="12" height="5"/>`;
  else if(d>=4)h=`<polyline class="st" points="${x-3},${c-10} ${x+3},${c-4} ${x-3},${c+2} ${x+2},${c+8}"/>`;
  else{h=`<line class="st" x1="${x-3}" y1="${c-6}" x2="${x+3}" y2="${c+8}"/><circle class="nh" cx="${x-4}" cy="${c-5}" r="2"/>`;if(d===1)h+=`<circle class="nh" cx="${x-6}" cy="${c+1}" r="2"/>`}
  if([3,6,12].includes(d))h+=`<circle class="nh" cx="${x+9}" cy="${c-4}" r="1.8"/>`;
  return h;
}

function render(scroll){
  notes.sort((a,b)=>a.s-b.s);
  const sh=shift(),bl=barLen();
  $('shiftTxt').textContent=sh===0?'移調なし':(sh>0?'+':'')+sh+' 半音';
  $('chips').textContent=notes.length?notes.map(n=>nm(n.m+sh)).join('  '):'音がまだありません。録音するか、上の音名ボタンを押してください。';
  const bars=Math.max(2,Math.ceil(endOf()/bl)+1),W=X0+bars*bl*U+10;
  let h='<text class="mt" x="4" y="26">五線譜</text><text class="mt" x="4" y="'+(TT-14)+'">タブ譜</text>';
  const ts=$('ts').value.split('/');
  h+=`<text class="big" x="30" y="${yS(4)-1}" text-anchor="middle">${ts[0]}</text><text class="big" x="30" y="${yS(0)-1}" text-anchor="middle">${ts[1]}</text>`;
  for(let i=0;i<5;i++)h+=`<line class="ln" x1="6" x2="${W-6}" y1="${yS(i*2)}" y2="${yS(i*2)}"/>`;
  for(let i=0;i<6;i++)h+=`<line class="ln" x1="6" x2="${W-6}" y1="${TT+i*TG}" y2="${TT+i*TG}"/>`;
  for(let k=0;k<=bars;k++){const x=X0+k*bl*U;h+=`<line class="ln" x1="${x}" x2="${x}" y1="${yS(8)}" y2="${yS(0)}"/><line class="ln" x1="${x}" x2="${x}" y1="${TT}" y2="${TT+5*TG}"/>`;if(k<bars)h+=`<text class="mt" x="${x+3}" y="${yS(8)-8}">${k+1}</text>`}
  /* 休符 */
  let p=0;
  for(const n of notes){
    let a=p;
    while(a<n.s){const edge=(Math.floor(a/bl)+1)*bl,g=Math.min(n.s,edge)-a,d=[16,12,8,6,4,3,2,1].find(v=>v<=g);h+=restSvg(a,d);a+=d}
    p=Math.max(p,n.s+n.d);
  }
  let prev=null;
  for(const n of notes){
    const x=xOf(n.s),m=n.m+sh,w=m+12,pc=((w%12)+12)%12,oct=Math.floor(w/12)-1;
    const step=oct*7+LET[pc]-30,y=yS(step);
    if(n===sel||n===pp)h+=`<rect class="sel" x="${x-13}" y="24" width="26" height="268" rx="6"/>`;
    if(step<=-2)for(let s=-2;s>=step;s-=2)h+=`<line class="ln" x1="${x-10}" x2="${x+10}" y1="${yS(s)}" y2="${yS(s)}"/>`;
    if(step>=10)for(let s=10;s<=step;s+=2)h+=`<line class="ln" x1="${x-10}" x2="${x+10}" y1="${yS(s)}" y2="${yS(s)}"/>`;
    h+=`<ellipse class="${n.d>=8?'nho':'nh'}" cx="${x}" cy="${y}" rx="6.5" ry="4.8" transform="rotate(-20 ${x} ${y})"/>`;
    if(n.d<16){
      const up=step<4,sx=up?x+6:x-6,ey=up?y-28:y+28,fl=n.d===1?2:(n.d===2||n.d===3)?1:0;
      h+=`<line class="st" x1="${sx}" x2="${sx}" y1="${y}" y2="${ey}"/>`;
      for(let f=0;f<fl;f++){const o=f*6*(up?1:-1);h+=`<path class="st" d="M${sx} ${ey+o} q8 ${up?6:-6} 5 ${up?14:-14}"/>`}
    }
    if([3,6,12].includes(n.d))h+=`<circle class="nh" cx="${x+11}" cy="${step%2===0?y-3:y}" r="1.8"/>`;
    if(NAMES[pc].length>1)h+=`<text class="tx" x="${x-20}" y="${y+4}">♯</text>`;
    const tp=tabPos(m,prev);
    if(n.tie){const nx=notes.find(q=>q.s===n.s+n.d&&q.m===n.m);if(nx){const x2=xOf(nx.s),dy=step<4?1:-1;h+=`<path class="st" d="M${x} ${y+dy*8} Q${(x+x2)/2} ${y+dy*17} ${x2} ${y+dy*8}"/>`}}
    if(tp){prev=tp.f;const ty=TT+tp.s*TG;h+=`<rect class="bg" x="${x-9}" y="${ty-7}" width="18" height="14"/><text class="tx" x="${x}" y="${ty+4}" text-anchor="middle">${tp.f}</text>`}
    else h+=`<text class="mt" x="${x}" y="${TT+2.5*TG+4}" text-anchor="middle">範囲外</text>`;
  }
  const svg=$('svg');svg.setAttribute('width',W);svg.setAttribute('viewBox','0 0 '+W+' 300');svg.innerHTML=h;
  if(scroll&&notes.length){const t=pp||sel||notes[notes.length-1],x=xOf(t.s),sc=svg.parentElement;if(x>sc.scrollLeft+sc.clientWidth-30)sc.scrollLeft=x-sc.clientWidth+60;else if(x<sc.scrollLeft+20)sc.scrollLeft=Math.max(0,x-60)}
  $('ed').hidden=!sel;
  if(sel){$('sname').textContent=nm(sel.m+sh);$('edur').value=sel.d}
}

$('svg').onclick=e=>{
  const x=e.clientX-$('svg').getBoundingClientRect().left;let best=null,bd=1e9;
  notes.forEach(n=>{const d=Math.abs(xOf(n.s)-x);if(d<bd){bd=d;best=n}});
  sel=bd<=U?best:null;render();
};
for(const id of ['from','to','ts','bpm'])$(id).onchange=()=>render();
const edit=(id,f)=>{$(id).onclick=()=>{if(sel){f(sel);render()}}};
edit('p-1',n=>n.m-=1);edit('p1',n=>n.m+=1);edit('p-12',n=>n.m-=12);edit('p12',n=>n.m+=12);
edit('m-1',n=>n.s=Math.max(0,n.s-1));edit('m1',n=>n.s+=1);
$('edur').onchange=()=>{if(sel){sel.d=+$('edur').value;render()}};
$('del').onclick=()=>{notes=notes.filter(n=>n!==sel);sel=null;render()};
$('undo').onclick=()=>{notes.sort((a,b)=>a.s-b.s);const x=notes.pop();if(x===sel)sel=null;render()};
$('clear').onclick=()=>{notes=[];sel=null;render()};

/* 音程検出 (YIN 方式) */
let ctx,an,stream,buf,timer=null,cand=-1,cnt=0,last=-1,silent=true,t0=null,cur=null,curOn=0;
function detect(){
  an.getFloatTimeDomainData(buf);
  let r=0;for(let i=0;i<buf.length;i++)r+=buf[i]*buf[i];
  lastRms=Math.sqrt(r/buf.length);if(lastRms<0.003)return -1;
  const sr=ctx.sampleRate,minL=Math.floor(sr/1000),maxL=Math.floor(sr/70),N=1024;
  const cm=new Float32Array(maxL+1),o=Math.max(0,buf.length-N-maxL);let run=0;
  for(let t=1;t<=maxL;t++){let s=0;for(let j=0;j<N;j++){const e=buf[o+j]-buf[o+j+t];s+=e*e}run+=s;cm[t]=run?s*t/run:1}
  for(let t=Math.max(2,minL);t<maxL;t++){
    if(cm[t]<0.25){let b=t;for(let k=t;k<maxL&&cm[k]<0.25;k++)if(cm[k]<cm[b])b=k;let tt=b;if(b>2&&b<maxL){const a=cm[b-1],c=cm[b+1],d=a-2*cm[b]+c;if(d>0)tt=b+(a-c)/(2*d)}return Math.round(69+12*Math.log2(sr/tt/440))}
  }
  let bt=0,bv=1;for(let t=Math.max(2,minL);t<maxL;t++)if(cm[t]<bv){bv=cm[t];bt=t}
  if(bt&&bv<0.4){for(let t=Math.max(2,minL);t<maxL;t++)if(cm[t]<=bv*1.15&&cm[t]<=cm[t-1]&&cm[t]<=cm[t+1]){bt=t;break}return Math.round(69+12*Math.log2(sr/bt/440))}
  return -1;
}
function tickOld(){
  const now=performance.now(),g=15000/bpm(),m=detect();
  if(m<0){silent=true;cand=-1;cnt=0;cur=null;$('live').textContent='–';return}
  $('live').textContent=nm(m);
  if(m===cand)cnt++;else{cand=m;cnt=1}
  if(cnt===3&&(silent||m!==last)){
    const on=now-100;if(t0===null)t0=on;
    cur={m,s:Math.max(Math.round((on-t0)/g),endOf()),d:1};curOn=on;notes.push(cur);last=m;silent=false;
  }else if(cur&&m===cur.m){
    cur.d=snap(Math.max(1,Math.round((now+50-curOn)/g)));
  }
  render(true);
}
$('src').onchange=()=>{$('mic').value=''};
async function pickMic(){
  const v=$('src').value;if(v==='auto')return '';
  const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput'&&d.deviceId!=='default'&&d.deviceId!=='communications');
  const ext=/usb|bluetooth|bt |headset|headphone|wired|external|accessory|interface|外部|ヘッドセット|ヘッドホン|イヤホン/i;
  const pool=ds.filter(d=>v==='ext'?ext.test(d.label):!ext.test(d.label));
  if(!pool.length){$('msg').textContent=v==='ext'?'外部機器が見つかりませんでした。接続を確認してください。標準のマイクで録音します。':'内蔵マイクを特定できませんでした。標準のマイクで録音します。';return ''}
  return pool[0].deviceId;
}
async function listMics(){
  try{
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
    const cur=$('mic').value;
    $('mic').innerHTML='<option value="">自動(外部機器があればそれ、なければ内蔵マイク)</option>'+ds.map((d,i)=>`<option value="${d.deviceId}">${d.label||'マイク '+(i+1)}</option>`).join('');
    $('mic').value=cur;
    $('micWrap').hidden=ds.length<2;
  }catch(e){}
}
async function start(){
  $('msg').textContent='';
  try{
    const AC={echoCancellation:false,noiseSuppression:false,autoGainControl:false};
    stream=await navigator.mediaDevices.getUserMedia({audio:AC});
    let dv=$('mic').value||await pickMic();
    if(dv&&stream.getAudioTracks()[0].getSettings().deviceId!==dv){stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:{...AC,deviceId:{exact:dv}}})}
    listMics();
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')await ctx.resume();
    const src=ctx.createMediaStreamSource(stream);
    an=ctx.createAnalyser();an.fftSize=4096;src.connect(an);buf=new Float32Array(an.fftSize);
    cand=-1;cnt=0;last=-1;silent=true;cur=null;t0=notes.length?performance.now()-endOf()*15000/bpm():null;
    sel=null;resetRec();timer=setInterval(tick,40);
    $('rec').textContent='録音を止める';$('rec').classList.add('on');
  }catch(e){
    $('msg').textContent='マイクを使えませんでした。ブラウザのマイク許可を確認してください。許可できない間は、音名ボタンで入力できます。';
  }
}
function stop(){
  clearInterval(timer);timer=null;cur=null;finishNote();render();
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(ctx)ctx.close();
  $('live').textContent='–';$('rec').textContent='録音を始める';$('rec').classList.remove('on');
}
$('rec').onclick=()=>{stopPlay();timer?stop():start()};

/* 録音の音符化(再現度を上げた版) */
let lastRms=0,R={};
function med(x){
  if(x<0){R.rec=[];return x}
  R.rec=(R.rec||[]).concat(x).slice(-3);
  const s=[...R.rec].sort((a,b)=>a-b);return s[s.length>>1];
}
function resetRec(){
  R={t0:null,n:null,on:0,last:0,hist:{},cand:-1,cnt:0,sil:0,peak:0,dip:false,dmin:1e9,dipAt:0};
  if(notes.length)R.t0=performance.now()-endOf()*15000/bpm();
}
function startNote(m,on,rms){
  if(R.t0===null)R.t0=on;
  const g=15000/bpm(),n={m,s:Math.max(Math.round((on-R.t0)/g),endOf()),d:1};
  R.n=n;R.on=on;R.last=performance.now();R.hist={[m]:3};R.peak=rms;R.dip=false;R.dmin=1e9;
  notes.push(n);
}
function finishNote(endMs){
  const n=R.n;if(!n)return;R.n=null;
  const g=15000/bpm(),raw=(endMs||R.last+20)-R.on;
  if(raw<80){notes=notes.filter(x=>x!==n);return}
  n.m=+Object.keys(R.hist).reduce((a,b)=>R.hist[b]>R.hist[a]?b:a);
  let rem=Math.min(32,Math.max(1,Math.round(raw/g))),pos=n.s;const bl=barLen(),ps=[];
  while(rem>0){const take=Math.min(rem,bl-pos%bl),d=[16,12,8,6,4,3,2,1].find(v=>v<=take);ps.push({m:n.m,s:pos,d});pos+=d;rem-=d}
  ps.forEach((p,i)=>{p.tie=i<ps.length-1});
  notes.splice(notes.indexOf(n),1,...ps);
}
function tick(){
  const now=performance.now(),g=15000/bpm(),m0=detect(),rms=lastRms,m=med(m0);
  $('lvl').style.width=Math.min(100,lastRms*1500)+'%';
  if(m<0){
    R.sil++;R.cand=-1;R.cnt=0;
    if(R.sil>=4&&R.n){finishNote();render(true)}
    $('live').textContent='–';return;
  }
  if(R.sil>0||R.soundOn===undefined)R.soundOn=now-25;R.sil=0;$('live').textContent=nm(m);
  if(R.n&&m===R.n.m){
    R.last=now;R.hist[m]=(R.hist[m]||0)+1;R.cand=-1;R.cnt=0;
    R.peak=Math.max(R.peak*.995,rms);
    if(rms<R.peak*.45){if(!R.dip){R.dip=true;R.dipAt=now}R.dmin=Math.min(R.dmin,rms)}
    else if(R.dip&&rms>R.dmin*1.8&&rms>R.peak*.6){const p=R.n.m;finishNote(R.dipAt);startNote(p,now-60,rms)}
  }else{
    if(m===R.cand)R.cnt++;else{R.cand=m;R.cnt=1}
    if(R.cnt>=(R.n?3:2)){const had=R.n,bk=R.cnt*40+25;finishNote();startNote(m,had?now-bk:Math.max(now-300,Math.min(now-bk,R.soundOn)),rms);R.cand=-1;R.cnt=0}
  }
  if(R.n)R.n.d=snap(Math.max(1,Math.round((R.last+20-R.on)/g)));
  render(true);
}

/* ピアノ再生(Web Audioで合成) */
let ac=null,master=null,pT=[],pp=null,playing=false;
const AMP=[1,.5,.28,.16,.09,.05];
function pianoNote(t,midi,dur){
  const f=440*Math.pow(2,(midi-69)/12),tau=Math.max(.5,2.4-(midi-36)*.025),g=ac.createGain(),lp=ac.createBiquadFilter();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.005);g.gain.setTargetAtTime(0,t+dur,.12);
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(9000,f*14),t);lp.frequency.setTargetAtTime(Math.max(900,f*3),t+.02,.5);
  g.connect(lp);lp.connect(master);
  AMP.forEach((a,i)=>{
    const fk=f*(i+1)*(1+.0005*i*i);if(fk>9000)return;
    for(const dt of [.9993,1.0007]){
      const o=ac.createOscillator(),h=ac.createGain();o.type='sine';o.frequency.value=fk*dt;
      h.gain.setValueAtTime(a*.55,t);h.gain.setTargetAtTime(0,t+.005,tau/(1+.7*i));
      o.connect(h);h.connect(g);o.start(t);o.stop(t+dur+1);
    }
  });
}
function mergeTies(a){const l=[];for(const n of a){const p=l[l.length-1],ok=n.t0!==undefined&&n.s===n.rs&&n.d===n.rd;
  if(p&&p.tie&&p.m===n.m&&p.s+p.d===n.s){p.d+=n.d;p.tie=n.tie;p.raw=p.raw&&ok}
  else l.push({o:n,m:n.m,s:n.s,d:n.d,tie:n.tie,t0:n.t0,t1:n.t1,raw:ok})}return l}
function stopPlay(){
  pT.forEach(clearTimeout);pT=[];
  if(master){master.disconnect();master=null}
  const was=playing;playing=false;pp=null;
  $('play').textContent='▶ ピアノで再生';$('play').classList.remove('on');
  if(was)render();
}
async function play(){
  if(playing){stopPlay();return}
  if(timer){$('msg').textContent='録音を止めてから再生してください。';return}
  if(!notes.length)return;
  $('msg').textContent='';
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')await ac.resume();
  master=ac.createDynamicsCompressor();master.connect(ac.destination);
  playing=true;$('play').textContent='■ 停止';$('play').classList.add('on');
  const q=15/bpm(),sh=shift(),t0=ac.currentTime+.15;
  const useRaw=$('rawt').checked,f=humBpm/bpm();let endT=0;
  mergeTies(notes).forEach(n=>{
    const r=useRaw&&n.raw,st=r?n.t0*f:n.s*q,du=r?(n.t1-n.t0)*f:n.d*q;
    pianoNote(t0+st,n.m+sh,Math.max(.1,du*.95));endT=Math.max(endT,st+du);
    pT.push(setTimeout(()=>{pp=n.o;render(true)},(.15+st)*1000));
  });
  pT.push(setTimeout(stopPlay,(.15+endT+.6)*1000));
}
/* ===== 鼻歌ファイル解析(倍音の強さ+なめらかさ) ===== */
function humAnalyze(pcm){
  const SR=8000,WIN=800,HOP=160,NF=4096,K=421,HW=[1,.9,.8,.7,.55,.45,.35,.3];
  const hann=new Float64Array(WIN);for(let i=0;i<WIN;i++)hann[i]=.5-.5*Math.cos(2*Math.PI*i/(WIN-1));
  const bw=SR/NF,f0=[];for(let k=0;k<K;k++)f0.push(70*Math.pow(2,k*10/1200));
  const idx=f0.map(f=>HW.map((w,h)=>{const fr=f*(h+1);return fr<3800?Math.round(fr/bw):-1}));
  // FFT
  const re=new Float64Array(NF),im=new Float64Array(NF),cosT=new Float64Array(NF/2),sinT=new Float64Array(NF/2);
  for(let i=0;i<NF/2;i++){cosT[i]=Math.cos(2*Math.PI*i/NF);sinT[i]=-Math.sin(2*Math.PI*i/NF)}
  const rev=new Uint16Array(NF);for(let i=0,b=Math.log2(NF);i<NF;i++){let r=0;for(let j=0;j<b;j++)if(i&(1<<j))r|=1<<(b-1-j);rev[i]=r}
  function fft(){
    for(let i=0;i<NF;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
    for(let s=2;s<=NF;s<<=1){const h=s>>1,st=NF/s;
      for(let i=0;i<NF;i+=s)for(let j=0,k=0;j<h;j++,k+=st){
        const a=i+j,b=a+h,tr=re[b]*cosT[k]-im[b]*sinT[k],ti=re[b]*sinT[k]+im[b]*cosT[k];
        re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti}}
  }
  const T=Math.floor((pcm.length-WIN)/HOP)+1,S=[],rms=new Float64Array(T),conf=new Float64Array(T),env=new Float64Array(T);
  const lo=Math.round(200/bw),hi=Math.round(3500/bw),sp=new Float64Array(NF/2),tmp=new Float64Array(hi-lo);
  for(let t=0;t<T;t++){
    const o=t*HOP;let e=0;for(let i=0;i<WIN;i++)e+=pcm[o+i]*pcm[o+i];rms[t]=Math.sqrt(e/WIN);
    {let q=0;const c=o+WIN/2-80;for(let i=0;i<160;i++){const v=pcm[c+i]||0;q+=v*v}env[t]=Math.sqrt(q/160)}
    const s=new Float32Array(K);
    if(rms[t]>.006){
      re.fill(0);im.fill(0);for(let i=0;i<WIN;i++)re[i]=pcm[o+i]*hann[i];fft();
      for(let j=0;j<NF/2;j++)sp[j]=Math.hypot(re[j],im[j]);
      for(let j=lo;j<hi;j++)tmp[j-lo]=sp[j];tmp.sort();const med=tmp[tmp.length>>1]+1e-9;
      for(let j=0;j<NF/2;j++)sp[j]=Math.log1p(sp[j]/med);
      let sum=0,mx=0;
      for(let k=0;k<K;k++){let v=0;
        for(let h=0;h<8;h++){const c=idx[k][h];if(c<0)break;let m=0;for(let d=-2;d<=2;d++){const x=sp[c+d];if(x>m)m=x}v+=HW[h]*m}
        s[k]=v;sum+=v;if(v>mx)mx=v}
      conf[t]=mx/(sum/K+1e-9)}
    S.push(s)}
  // Viterbi(なめらかな音程の道すじ)
  const R=80,PL=1.2,dp=new Float64Array(K),nd=new Float64Array(K),bp=[];
  for(let k=0;k<K;k++)dp[k]=-S[0][k];
  for(let t=1;t<T;t++){
    let gb=1e18,gk=0;for(let k=0;k<K;k++)if(dp[k]<gb){gb=dp[k];gk=k}
    const b=new Int16Array(K);
    for(let k=0;k<K;k++){
      let best=gb+PL,bk=gk;
      for(let j=Math.max(0,k-R);j<=Math.min(K-1,k+R);j++){const c=dp[j]+Math.min(Math.abs(j-k),60)*.02;if(c<best){best=c;bk=j}}
      nd[k]=best-S[t][k];b[k]=bk}
    bp.push(b);dp.set(nd)}
  const path=new Int16Array(T);let bk=0,bv=1e18;for(let k=0;k<K;k++)if(dp[k]<bv){bv=dp[k];bk=k}
  path[T-1]=bk;for(let t=T-1;t>0;t--)path[t-1]=bp[t-1][path[t]];
  const mid=new Float64Array(T),voiced=new Uint8Array(T);
  for(let t=0;t<T;t++)mid[t]=69+12*Math.log2(f0[path[t]]/440);
  const cs=[];for(let t=0;t<T;t++)if(rms[t]>.008)cs.push(conf[t]);cs.sort((a,b)=>a-b);
  const th=cs.length?cs[Math.floor(cs.length*.25)]:0;
  for(let t=0;t<T;t++)voiced[t]=rms[t]>.008&&conf[t]>th?1:0;
  return{mid,voiced,env,hop:HOP/SR,center:WIN/SR/2};
}
/* 音程の列 → 音符(秒単位) */
function humNotes(an){
  const {mid,voiced,hop,center}=an,T=mid.length;
  const md=new Float64Array(T);
  for(let t=0;t<T;t++){const a=[];for(let d=-2;d<=2;d++){const u=t+d;if(u>=0&&u<T&&voiced[u])a.push(mid[u])}a.sort((x,y)=>x-y);md[t]=a.length?a[a.length>>1]:mid[t]}
  const env=an.env;
  const dip=(a,b)=>{if(!env)return false;let pl=0,pr=0,vl=1e9;
    for(let u=Math.max(0,a-2);u<=a;u++)pl=Math.max(pl,env[u]);
    for(let u=b;u<=Math.min(T-1,b+2);u++)pr=Math.max(pr,env[u]);
    for(let u=a;u<=b;u++)vl=Math.min(vl,env[u]);
    return vl<.35*Math.min(pl,pr)};
  const join=(a,b)=>b-a<=6&&!dip(a,b);
  let runs=[];
  for(let t=0;t<T;t++){if(!voiced[t])continue;const r=Math.round(md[t]),L=runs[runs.length-1];
    if(L&&L.r===r&&join(L.e,t)){L.e=t;L.v.push(md[t])}else runs.push({r,s:t,e:t,v:[md[t]]})}
  // 短い run は近い隣へ吸収
  for(let pass=0;pass<3;pass++){
    for(let i=0;i<runs.length;i++){const q=runs[i];if(q.e-q.s+1>=2)continue;
      const p=runs[i-1],n=runs[i+1];
      const near=x=>x&&q.s-x.e<=3&&x.s<q.s?Math.abs(x.r-q.r):(x&&x.s>q.e&&x.s-q.e<=3?Math.abs(x.r-q.r):99);
      const dp_=p&&q.s-p.e<=3?Math.abs(p.r-q.r):99,dn_=n&&n.s-q.e<=3?Math.abs(n.r-q.r):99;
      if(dp_<=1&&dp_<=dn_){p.e=q.e;p.v.push(...q.v);runs.splice(i,1);i--}
      else if(dn_<=1){n.s=q.s;n.v.unshift(...q.v);runs.splice(i,1);i--}}
    for(let i=1;i<runs.length-1;i++){const p=runs[i-1],q=runs[i],n=runs[i+1];
      if(p.r===n.r&&Math.abs(q.r-p.r)===1&&q.e-q.s+1<6&&!dip(p.e,n.s)){p.e=n.e;p.v.push(...q.v,...n.v);runs.splice(i,2);i--}}
    // 同じ音が隣り合えば結合
    for(let i=1;i<runs.length;i++){const p=runs[i-1],q=runs[i];if(p.r===q.r&&join(p.e,q.s)){p.e=q.e;p.v.push(...q.v);runs.splice(i,1);i--}}
  }
  return runs.filter(q=>q.e-q.s+1>=3).map(q=>{q.v.sort((x,y)=>x-y);
    return{m:Math.round(q.v[q.v.length>>1]),on:q.s*hop+center-hop/2,off:(q.e+1)*hop+center-hop/2}});
}
if(typeof module!=='undefined')module.exports={humAnalyze,humNotes};

/* 外れ値の音を、周りの音に近いオクターブへ寄せる */
function humFold(notes){
  return notes.map((n,i)=>{
    const nb=[];for(let d=-3;d<=3;d++)if(d&&notes[i+d])nb.push(notes[i+d].m);
    if(nb.length<2)return n;nb.sort((a,b)=>a-b);const ref=nb[nb.length>>1];
    let m=n.m;while(m-ref>=8)m-=12;while(ref-m>=8)m+=12;
    return m===n.m?n:Object.assign({},n,{m})});
}
/* テンポ推定: 16分音符の格子に出だしがどれだけ合うか */
function humTempo(notes){
  if(notes.length<4)return 100;
  const o0=notes[0].on;let best=100,bs=1e9;
  for(let b=60;b<=160;b++){
    const g=15/b;let e=0;
    for(const n of notes){const x=(n.on-o0)/g;e+=Math.abs(x-Math.round(x))}
    e=e/notes.length+Math.abs(Math.log(b/100))*.08;
    if(e<bs){bs=e;best=b}}
  return best;
}
/* 秒の音符 → 譜面の音符(16分音符単位、小節をまたぐ音はタイ) */
function humQuantize(notes,bpm,bl){
  const g=15/bpm,out=[];let o0=notes.length?notes[0].on:0;
  if(notes.length>3){let be=1e9,bp=0;for(let k=0;k<30;k++){const ph=(k/30-.5)*g;let e=0;for(const n of notes){const x=(n.on-notes[0].on+ph)/g;e+=Math.abs(x-Math.round(x))}if(e<be){be=e;bp=ph}}o0=notes[0].on-bp}
  const q=notes.map(n=>({m:n.m,s:Math.round((n.on-o0)/g)+0,e:Math.round((n.off-o0)/g)+0,t0:n.on-notes[0].on,t1:n.off-notes[0].on}));
  for(let i=0;i<q.length;i++){
    const n=q[i],nx=q[i+1];
    if(nx&&nx.s<=n.s)nx.s=n.s+1;                       // 同時刻は1つ後ろへ
    let e=Math.max(n.e,n.s+1);
    if(nx&&e>nx.s)e=nx.s;  // 重なりをなくし、1つ分以下のすき間はつなぐ
    n.e=e}
  for(const n of q){
    let rem=Math.min(32,n.e-n.s),pos=n.s;const ps=[];
    while(rem>0){const take=Math.min(rem,bl-pos%bl),d=[16,12,8,6,4,3,2,1].find(v=>v<=take);ps.push({m:n.m,s:pos,d,t0:n.t0,t1:n.t1,rs:pos,rd:d});pos+=d;rem-=d}
    ps.forEach((p,i)=>{p.tie=i<ps.length-1;out.push(p)})}
  return out;
}
if(typeof module!=='undefined')Object.assign(module.exports,{humFold,humTempo,humQuantize});

/* ===== ファイルから読み込む(音声・動画) ===== */
let humRaw=null;
let humBpm=100;
function applyHum(){humBpm=bpm();notes=humQuantize(humRaw,bpm(),barLen());sel=null;render();$('svg').parentElement.scrollLeft=0}
$('imp').onclick=()=>{stopPlay();$('file').click()};
$('requant').onclick=()=>{if(humRaw)applyHum()};
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const say=t=>{$('impMsg').textContent=t};
  try{
    say('読み込み中…');
    const ab=await f.arrayBuffer(),dc=new (window.AudioContext||window.webkitAudioContext)();
    let buf;
    try{buf=await dc.decodeAudioData(ab)}catch(err){dc.close();say('この形式の音声を読み込めませんでした。m4a・mp3・wav などに変換して試してください。');return}
    dc.close();
    if(buf.duration>180){say('3分までのファイルに対応しています。短く切って試してください。');return}
    say('解析中…(数秒かかります)');
    const oc=new OfflineAudioContext(1,Math.ceil(buf.duration*8000),8000),s=oc.createBufferSource();
    s.buffer=buf;s.connect(oc.destination);s.start();
    const r=await oc.startRendering();
    await new Promise(z=>setTimeout(z,30));
    humRaw=humFold(humNotes(humAnalyze(r.getChannelData(0))));
    if(!humRaw.length){say('音程のある音を見つけられませんでした。');return}
    $('bpm').value=humTempo(humRaw);
    applyHum();$('requant').hidden=false;$('rawWrap').hidden=false;
    say(humRaw.length+'個の音を読み取りました。テンポは約'+$('bpm').value+'と推定しました。変えるときはテンポ欄を直して「いまのテンポで変換し直す」を押してください。');
  }catch(err){say('読み込みに失敗しました。別のファイルで試してください。')}
};

$('play').onclick=play;

/* タップテンポ */
let taps=[];
function tapTempo(){
  const n=performance.now();
  if(taps.length&&n-taps[taps.length-1]>2000)taps=[];
  taps.push(n);taps=taps.slice(-8);
  if(taps.length>=2){
    const b=Math.round(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)));
    $('bpm').value=Math.min(240,Math.max(40,b));render();
  }
}
$('tap').addEventListener('pointerdown',e=>{e.preventDefault();tapTempo()});
$('tap').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapTempo()}});
render();
</script>
